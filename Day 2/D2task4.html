<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
    <style>
        body {
            background-color: lime;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        table {
            border-collapse: collapse;
            background-color: white;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px 20px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>id</th>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Karam</td>
            <td>Math</td>
            <td>95</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Habiba</td>
            <td>Science</td>
            <td>88</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Hussin</td>
            <td>Geography</td>
            <td>75</td>
        </tr>
        <tr>
            <td>#</td>
            <td>Name</td>
            <td>Subject</td>
            <td>Grade</td>
        </tr>
    </table>
</body>
</html>
