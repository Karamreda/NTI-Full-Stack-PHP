<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validated Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark pt-5">
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg w-100" style="max-width: 500px;">
      <div class="card-body bg-secondary rounded">
        <h3 class="text-center text-white mb-4">📝 User Info</h3>
        <form class="was-validated">
          <div class="mb-3">
            <label for="validationServer01" class="form-label text-light">Name</label>
            <input type="text" class="form-control" id="validationServer01" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please enter your name.</div>
          </div>

          <div class="mb-3">
            <label for="validationServer02" class="form-label text-light">Telephone Number</label>
            <input type="tel" class="form-control" id="validationServer02" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please enter your telephone number.</div>
          </div>

          <div class="mb-4">
            <label for="validationServer03" class="form-label text-light">City</label>
            <input type="text" class="form-control" id="validationServer03" required>
            <div class="valid-feedback">Looks good!</div>
            <div class="invalid-feedback">Please enter your city.</div>
          </div>

          <button class="btn btn-success w-100" type="submit">✅ Submit</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
