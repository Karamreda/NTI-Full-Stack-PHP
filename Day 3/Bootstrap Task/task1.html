<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects Grid</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <style>
        .subject-box {
            padding: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-info pt-5">
    <div class="container">
        <div class="row mt-5 g-4">
            <div class="col-lg-3 col-md-6 col-12">
                <div class="subject-box bg-success text-white">English</div>
            </div>
            <div class="col-lg-3 col-md-6 col-12">
                <div class="subject-box bg-primary text-white">Math</div>
            </div>
            <div class="col-lg-3 col-md-6 col-12">
                <div class="subject-box bg-danger text-white">Arabic</div>
            </div>
            <div class="col-lg-3 col-md-6 col-12">
                <div class="subject-box bg-warning text-white">Computer</div>
            </div>
        </div>
    </div>
    
    <script src="js/bootstrap.bundle.js"></script> 
</body>
</html>
